name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:rules
      - run: npm run pack:mcpb
      # Runs the packed extension over stdio, like Claude Desktop does.
      - run: npx vitest run scripts/test
      - run: npx playwright install --with-deps chromium firefox webkit
      # Browser tests, plus installing the npm package with npx and talking to it over MCP.
      - run: npx vitest run -c vitest.e2e.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            apps/mcp-server/dist/loam.mcpb
            apps/mcp-server/dist/npm-out/*.tgz
